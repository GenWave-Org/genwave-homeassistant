blueprint:
  name: GenWave - Dinner bell
  description: >
    Announce "Dinner is ready." through your GenWave station's DJ when a button or scene fires.
    Airs in the next DJ break - minutes, not seconds; this is deliberately not a doorbell-class
    notification channel.
  domain: automation
  source_url: https://raw.githubusercontent.com/GenWave-Org/genwave-homeassistant/main/blueprints/automation/genwave/dinner-bell.yaml
  input:
    bell:
      name: Dinner bell
      description: >
        The input_button or scene that rings the bell. Fires on a press or an activation of this
        entity - never on an attribute-only change or an unavailable-to-available reconnect.
      selector:
        entity:
          domain:
            - input_button
            - scene
    message:
      name: Message
      description: What the DJ announces. Can be a template.
      default: Dinner is ready.
      selector:
        text:
    verbatim:
      name: Speak verbatim
      description: >
        Off (default) lets the on-air persona work this into copy in character, always preserving
        the message's own words. On speaks it exactly as written.
      default: false
      selector:
        boolean:
    ttl_seconds:
      name: Time to live
      description: >
        How long the announcement stays eligible to air before expiring unspoken, in seconds.
        900 (15 minutes) matches the station's own default.
      default: 900
      selector:
        number:
          min: 60
          max: 3600
          unit_of_measurement: seconds
          mode: box

trigger:
  - trigger: state
    entity_id: !input bell
    not_from:
      - unknown
      - unavailable

condition:
  - condition: template
    value_template: "{{ trigger.from_state is not none }}"

action:
  - action: genwave.announce
    data:
      message: !input message
      verbatim: !input verbatim
      ttl_seconds: !input ttl_seconds
